name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest -q
      # the committed JSON Schemas are the contract TS clients generate from — drift fails here.
      # The generator is pinned (schema.GENERATOR_PYDANTIC), the library is not: the export runs
      # under exactly that pydantic so a pydantic release cannot redden CI with unchanged sources.
      - run: |
          GEN=$(uv run python -c 'from datamodels.optics.schema import GENERATOR_PYDANTIC as v; print(v)')
          uv run --with "pydantic==$GEN" datamodels-export-schemas
          # porcelain catches modified, added (untracked) and removed schema files alike
          if [ -n "$(git status --porcelain -- schemas/)" ]; then git status --porcelain -- schemas/; git diff -- schemas/; exit 1; fi

  schemas:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: |
          GEN=$(uv run python -c 'from datamodels.optics.schema import GENERATOR_PYDANTIC as v; print(v)')
          uv run --with "pydantic==$GEN" datamodels-export-schemas
      - uses: actions/upload-artifact@v4
        with:
          name: optics-json-schemas
          path: schemas/optics/*.schema.json
