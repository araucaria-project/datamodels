name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest -q

  # JSON Schemas are a build artifact of the pydantic models (the only source of truth), generated
  # under the pinned generator (schema.GENERATOR_PYDANTIC) — never committed, never diffed.
  schemas:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release assets
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: |
          GEN=$(uv run python -c 'from datamodels.optics.schema import GENERATOR_PYDANTIC as v; print(v)')
          uv run --with "pydantic==$GEN" datamodels-export-schemas schemas/optics
      - uses: actions/upload-artifact@v4   # preview for reviewers on every PR / master push
        with:
          name: optics-json-schemas
          path: schemas/optics/*.schema.json
      - name: Publish schemas with the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF_NAME}
          PKG=$(uv run python -c 'from datamodels.optics.schema import package_version as v; print(v())')
          test "v$PKG" = "$TAG" || { echo "tag $TAG does not match pyproject version $PKG"; exit 1; }
          (cd schemas/optics && zip -q "../../optics-schemas-$TAG.zip" ./*.schema.json)
          gh release create "$TAG" "optics-schemas-$TAG.zip" --verify-tag --generate-notes || gh release upload "$TAG" "optics-schemas-$TAG.zip" --clobber
