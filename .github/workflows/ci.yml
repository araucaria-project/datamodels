name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest -q
      # the committed JSON Schemas are the contract TS clients generate from — drift fails here
      - run: uv run datamodels-export-schemas && git diff --exit-code -- schemas/

  schemas:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run datamodels-export-schemas
      - uses: actions/upload-artifact@v4
        with:
          name: optics-json-schemas
          path: schemas/optics/*.schema.json
